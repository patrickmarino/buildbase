name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo. No third-party action can use
# the token to mutate the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Backend: clippy + tests (unit + sqlx/HTTP integration against Postgres) ──
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Local Postgres has no TLS; #[sqlx::test] creates isolated DBs per test.
      DATABASE_URL: postgres://core:core@localhost:5432/core?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      # Use the runner's preinstalled rustup; rust-toolchain.toml pins 1.96 (for
      # sqlx 0.9) and its components, so no third-party toolchain action is needed.
      - name: Install Rust toolchain
        working-directory: apps/api
        run: |
          rustup show active-toolchain
          rustc --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: Format check
        working-directory: apps/api
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: apps/api
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration)
        working-directory: apps/api
        run: cargo test --all

  # ── Frontend: typecheck + lint + unit tests + build ─────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter core typecheck

      - name: Lint
        run: pnpm --filter core lint

      - name: Unit tests
        run: pnpm --filter core test

      - name: Build
        run: pnpm --filter core build

  # ── End-to-end: Playwright drives the full stack (API + SPA + Postgres) ──────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core -d core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://core:core@localhost:5432/core?sslmode=disable
      SEED_OWNER_EMAIL: elena@madespace.co
      SEED_OWNER_PASSWORD: changeme-dev-only
      E2E_EMAIL: elena@madespace.co
      E2E_PASSWORD: changeme-dev-only
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        working-directory: apps/api
        run: rustup show active-toolchain && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Prebuild API (so the webServer boots fast)
        working-directory: apps/api
        run: cargo build -p core-web

      # playwright.config starts the API + SPA itself and reads DATABASE_URL/seed
      # creds from the env above.
      - name: Run e2e
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
