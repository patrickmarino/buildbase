# Compose project name (network + volume prefix) follows the project slug,
# written to .env by scripts/bootstrap.sh as COMPOSE_PROJECT_NAME.
name: ${COMPOSE_PROJECT_NAME:-core}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-core}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-core}
      POSTGRES_DB: ${POSTGRES_DB:-core}
    ports:
      # Host port is 5440 by default to avoid clashing with other local
      # Postgres instances; override with PG_HOST_PORT.
      - "${PG_HOST_PORT:-5440}:5432"
    volumes:
      - core_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core} -d ${POSTGRES_DB:-core}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mailpit — local SMTP sink + web UI for testing outbound email.
  # Host ports default to 1026/8026 to avoid clashing with other local Mailpit
  # instances (the conventional 1025/8025 may be in use); override via env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-core}-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8026}:8025" # web UI → http://localhost:8026
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  core_pg_data:
